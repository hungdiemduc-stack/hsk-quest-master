<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK Quest Master - RPG Chinese Learning Game</title>
  
  <meta name="description" content="Chinh phục HSK 1 - 4 dễ dàng với HSK Quest Master: Flashcard 3D, Quiz Quest, Ghép từ & Speed Run 30s!" />
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.3s ease-out'
          }
        }
      }
    };
  </script>

  <!-- Import Maps for Modern ES Modules (React 18 & Lucide Icons) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react"
      }
    }
  </script>
</head>
<body class="antialiased selection:bg-red-500 selection:text-white">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
